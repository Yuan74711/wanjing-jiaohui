<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>站内搜索 · 老槐树饺子馆</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/warm.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>站内搜索</h1>
    <div class="tagline">问镜子，它替你找。</div>
    <nav><a href="index.html">首页</a><a href="menu.html">菜单</a><a href="about.html">关于</a></nav>
  </header>

  <main>
    <div class="card">
      <p>输入一个词。镜子会告诉你，它倒映出了什么。</p>
      <p class="whisper">试试你刚刚在别处看到过的字。</p>
      <form id="searchForm" method="get" class="search-box">
        <input id="searchInput" type="text" placeholder="在这里输入关键词…" autocomplete="off" autofocus>
        <button type="submit">照镜子</button>
      </form>
      <div id="searchMsg"></div>
      <div class="search-history" id="searchHistory"></div>
      <p class="whisper">不知道搜什么？把你在别处看见过的字、数字、年份——都试一遍。镜子听得懂的，比你以为的多。</p>
    </div>

    <div class="creed">你看见的每一面镜子，<b>都是门</b>。</div>
  </main>

  <footer class="site">
    <div id="progress"></div>
    <p>© 老槐树饺子馆</p>
    <span class="anomaly glitch">镜</span>
  </footer>
</div>

<script src="js/progress.js"></script>
<script src="js/f12.js"></script>
<script src="js/search.js"></script>
</body>
</html>
