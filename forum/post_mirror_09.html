      <h2>颜色藏字</h2>
      <p>第九面镜子是用颜色写的。下面这串十六进制，每一个字节都是一个字：</p>
      <pre class="code">E9 95 9C</pre>
      <p class="whisper">把它当成 UTF-8 字节解码（或搜「E9959C 解码」），你会得到我们一直挂在嘴边的那个字。</p>
      <p class="whisper">镜子会自己领你走。回到论坛，剩下的都在那儿。</p>
    </div>
