<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>镜面节点 ⑬ · 你的名字</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/silver.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>万镜教会 · 镜面论坛</h1>
    <div class="tagline">你看见的每一面镜子，都是门</div>
    <nav><a href="index.html">论坛</a><a href="../search.html">搜索</a><a href="../index.html">老槐树</a></nav>
  </header>

  <main>
    <div class="card">
      <div class="node-tag">镜面节点 13 / 13 · 终镜</div>
      <h2>第十三面镜子</h2>
      <p>你站到了第十三面镜子前。镜子里浮现出一行字——</p>
      <p class="creed" id="idShow">……</p>
      <p>这是你的编号。从你点开第一面镜子起，它就一直在被写。</p>
      <p>镜主说：「第十三次仪式，只差一个确认。」</p>
      <p class="whisper">第十三次仪式，只差一个确认。该回去的地方，一直都在。</p>
      <div id="nextGate"></div>
    </div>

    <div class="card">
      <form id="searchForm" method="get" class="search-box">
        <input id="searchInput" type="text" placeholder="问镜子一个问题…" autocomplete="off">
        <button type="submit">照镜子</button>
      </form>
      <div id="searchMsg"></div>
    </div>

    <div class="creed">你看见的每一面镜子，<b>都是门</b>。</div>
    <div id="puzzleBox"></div>
  </main>

  <footer class="site">
    <div id="progress"></div>
    <p>© 万镜教会 · 镜面论坛</p>
    <span class="anomaly glitch">镜</span>
  </footer>
</div>

<script src="../js/progress.js"></script>
<script src="../js/f12.js"></script>
<script src="../js/search.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/puzzle.js"></script>
<script>
  Progress.setChapter(2);
  document.getElementById('idShow').textContent = '编号：' + Progress.getId();
  try { Drone.start({ freq: 45, level: 0.1 }); } catch (e) {}
</script>
</body>
</html>
