<div class="wrap">
  <header class="site">
    <h1>万镜教会 · 镜面论坛</h1>
    <div class="tagline">你看见的每一面镜子，都是门</div>
    <nav><a href="index.html">论坛</a><a href="../search.html">搜索</a><a href="../index.html">老槐树</a></nav>
  </header>

  <main>
    <div class="card">
      <div class="node-tag">镜面节点 8 / 13</div>
      <h2>镜中字</h2>
      <p>第八面镜子把字翻了过来。要读懂它，得把它当成一面镜子——左右对调：</p>
      <p class="mirror-text">门是都，子镜面一每的见看你</p>
      <p class="whisper">拿一面真的镜子，照着屏幕看；或者，在心里把它翻回来。</p>
    </div>

    <div class="card">
      <h3>门后面是什么</h3>
      <p>双生门后面，不是另一句话，是沉默。教会说，把一句信条倒着读、照着看都认得之后，你就不再需要句子了——你直接站在门里。</p>
    </div>

    <div class="card">
      <h3>接下来</h3>
      <p class="whisper">第九面镜子，会把那个被你反复看见的字，换个写法再给你。第十面，只给你一个日期。</p>
      <p class="whisper">回到论坛，第九面镜子，在等你。</p>
    </div>

    <div class="card">
      <form id="searchForm" method="get" class="search-box">
        <input id="searchInput" type="text" placeholder="问镜子一个问题…" autocomplete="off">
        <button type="submit">照镜子</button>
      </form>
      <div id="searchMsg"></div>
    </div>

    <div class="creed">你看见的每一面镜子，<b>都是门</b>。</div>
    <div id="puzzleBox"></div>
  </main>

  <footer class="site">
    <div id="progress"></div>
    <p>© 万镜教会 · 镜面论坛</p>
    <span class="anomaly glitch">镜</span>
  </footer>
