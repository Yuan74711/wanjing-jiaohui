<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>评论 · 老槐树饺子馆</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/warm.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>老槐树饺子馆</h1>
    <div class="tagline">顾客评论</div>
    <nav>
      <a href="menu.html">菜单</a>
      <a href="about.html">关于</a>
      <a href="contact.html">联系</a>
      <a href="search.html">站内搜索</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>大家怎么说</h2>
      <ul class="reviews">
        <li>「槐花猪肉饺绝了，连吃三两。」—— 食客甲 ★★★★★</li>
        <li>「总有种被盯着的感觉，尤其点酸菜羊肉那次。」—— 食客乙 ★★★★☆</li>
        <li class="anomaly">「想知道更多，去镜面论坛。门一直开着。」—— <b>镜主</b>
          <a class="link" href="forum/index.html">▸ 镜面论坛</a></li>
      </ul>
    </div>

    <div class="card">
      <h2>留下你的评论</h2>
      <textarea id="rv" rows="3" placeholder="说点什么……"></textarea>
      <button id="post">发表</button>
      <p id="mine" class="hint"></p>
    </div>

    <div class="creed">你看见的每一面镜子，<b>都是门</b>。</div>
  </main>

  <footer class="site">
    <div id="progress"></div>
    <p>© 老槐树饺子馆 · 自 1999 年至今</p>
    <span class="anomaly glitch" id="mirrorEgg" title="……">镜</span>
  </footer>
</div>

<script src="js/progress.js"></script>
<script src="js/f12.js"></script>
<script src="js/audio.js"></script>
<script>
  document.getElementById('mirrorEgg').addEventListener('click', function () {
    try { Drone.start({ freq: 48, level: 0.04 }); } catch (e) {}
    location.href = '404.html';
  });
  document.getElementById('post').addEventListener('click', function () {
    var v = document.getElementById('rv').value.trim();
    if (!v) return;
    document.getElementById('mine').textContent = '已发表。镜主会看到的。';
    document.getElementById('rv').value = '';
  });
</script>
</body>
</html>
