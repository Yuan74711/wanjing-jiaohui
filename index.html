    <nav>

  <main>
    <div class="card">
      <p>欢迎来老槐树。我们用地道的面粉、当季的菜，包出你记忆里的那一口。</p>
      <p class="whisper">……你有没有觉得，有些门，看着……像镜子？</p>

    <div class="card">

        <li>槐花猪肉饺 · 18 元 / 两</li>

      </ul>
    </div>

    <div class="card">
      <p>地址：城南老街 <b>13</b> 号。每晚 19:00 以后，玻璃窗上会映出很长的影子。</p>
    <p>如果你在找什么，<a class="link" href="search.html">站内搜索</a> 也许能替你问问镜子。</p>
  </div>

  <p class="whisper">（页脚的空白处，好像有什么淡淡的，在闪。）</p>

  <div class="creed">你看见的每一面镜子，<b>都是门</b>。</div>
  </main>

  <footer class="site">

    <p>© 老槐树饺子馆 · 自 1999 年至今</p>

<script>

    if (!localStorage.getItem('seenIntro')) { location.href = 'browser.html'; }
  } catch (e) {}
  document.getElementById('mirrorEgg').addEventListener('click', function () {
    try { Drone.start({ freq: 48, level: 0.04 }); } catch (e) {}

  });
